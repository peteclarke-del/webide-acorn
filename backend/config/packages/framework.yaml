framework:
  secret: '%env(APP_SECRET)%'
  http_method_override: false
  handle_all_throwables: true
  php_errors:
    log: true
  router:
    utf8: true
  session: false

# The test client, which is how the API description is checked against the real
# routes and the real answers rather than against a reading of them. Confined to
# the test environment: it is a way in that production has no use for.
when@test:
  framework:
    test: true
