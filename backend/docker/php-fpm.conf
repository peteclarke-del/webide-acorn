[global]
daemonize = no
error_log = /proc/self/fd/2
log_level = notice

[www]
listen = /run/php/native-builder.sock
listen.mode = 0666
pm = static
pm.max_children = 2
pm.max_requests = 100
catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
env[APP_ENV] = prod
env[APP_DEBUG] = 0
env[APP_SECRET] = local-container-secret-not-an-auth-token
env[CA65_PATH] = /usr/bin/ca65
env[CC65_PATH] = /usr/bin/cc65
env[CC65_BBC_RUNTIME] = /usr/local/lib/8bit-net/cc65-bbc
env[CC65_BBC_INCLUDE] = /usr/local/share/8bit-net/cc65-bbc/include
env[LD65_PATH] = /usr/bin/ld65
env[TOOLCHAIN_PACKAGE_VERSION] = 2.19-1
env[ARM_BINUTILS_PACKAGE_VERSION] = 2.40-2+18+b1
env[ARM_AS_PATH] = /usr/bin/arm-none-eabi-as
env[ARM_LD_PATH] = /usr/bin/arm-none-eabi-ld
env[ARM_OBJCOPY_PATH] = /usr/bin/arm-none-eabi-objcopy
env[ARM_OBJDUMP_PATH] = /usr/bin/arm-none-eabi-objdump
env[ARM_NM_PATH] = /usr/bin/arm-none-eabi-nm
env[ARM_READELF_PATH] = /usr/bin/arm-none-eabi-readelf
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 15
php_admin_value[post_max_size] = 2M
php_admin_value[upload_max_filesize] = 2M
php_admin_value[expose_php] = Off
php_admin_value[session.save_handler] = files
php_admin_value[session.save_path] = /tmp
security.limit_extensions = .php
