server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # The store carries whole projects, including assets, so it accepts a larger
    # body than the build API's two megabytes. The number matches
    # ProjectStoreController's own ceiling on purpose: if nginx refused first,
    # the caller would get a bare 413 with none of the store's wording about
    # what it accepts and why.
    location ^~ /api/v1/store {
        client_max_body_size 16m;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/native-builder.sock;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_connect_timeout 2s;
        fastcgi_send_timeout 12s;
        fastcgi_read_timeout 30s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /api/ {
        client_max_body_size 2m;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/native-builder.sock;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_connect_timeout 2s;
        fastcgi_send_timeout 12s;
        fastcgi_read_timeout 12s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /theme-overrides.css {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /emulator.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers-embedded.conf;
    }

    location = /archimedes.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers-embedded.conf;
    }

    location /arculator/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers-embedded.conf;
    }

    # The second Electron core is WebAssembly like the Archimedes one, so its
    # page and its artefacts are served under the embedded policy rather than
    # the workbench's. The ElkJS Electron page is plain JavaScript and stays
    # under the strict one.
    location = /elkulator.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers-embedded.conf;
    }

    location /elkulator/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers-embedded.conf;
    }

    location /source/ {
        try_files $uri =404;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
