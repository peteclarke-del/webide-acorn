<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8bit-net Acorn Electron runtime</title>
  <link rel="stylesheet" href="/electron-runtime.css" />
  <script defer src="/electron/elkjs-namespace.js"></script>
  <script defer src="/electron/elkjs/sheila.js"></script>
  <script defer src="/electron/elkjs/keyboard.js"></script>
  <script defer src="/electron/elkjs/memory.js"></script>
  <script defer src="/electron/elkjs/display.js"></script>
  <script defer src="/electron/elkjs/processor.js"></script>
  <script defer src="/electron/elkjs/sound.js"></script>
  <script defer src="/electron-runtime.js"></script>
</head>
<body>
  <main>
    <canvas id="screen" width="640" height="512" tabindex="0" aria-label="Acorn Electron emulated display"></canvas>
    <div id="runtime-status" role="status" aria-live="polite">Loading ElkJS…</div>
    <pre id="output" aria-label="Acorn Electron emulator diagnostics"></pre>
  </main>
</body>
</html>
